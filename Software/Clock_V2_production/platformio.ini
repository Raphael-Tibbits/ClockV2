; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328P]
platform = atmelavr
board = ATmega328P

build_flags = -Wall -Wextra -Wpedantic -O1

src_filter = +<*> -<time.cpp> -<time.h>

board_build.f_cpu = 16000000UL


; set fuses for external clock @16 MHz, no prescaler
board_fuses.lfuse = 0xE0
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFF

upload_protocol = custom
upload_flags =  -pm328p 
    -cusbasp 
    -B4

upload_command = "C:\Temp\avrdude-main\avrdude.exe" $UPLOAD_FLAGS -U flash:w:.pio\build\ATmega328P\firmware.hex




